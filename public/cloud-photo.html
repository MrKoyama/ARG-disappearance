<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="images/favicon-cloud.svg">
  <title>共有された写真 | Cloudfile</title>
  <style>
    :root{--bg:#17191d;--panel:#22252a;--line:#393d44;--text:#f5f6f8;--muted:#aeb3bc;--blue:#5e92ff;--footer:#111317}
    *{box-sizing:border-box}
    html,body{min-height:100%;margin:0}
    body{display:flex;min-height:100vh;flex-direction:column;color:var(--text);background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic UI","Yu Gothic",sans-serif}
    button,a{font:inherit}
    .viewer-header{position:sticky;top:0;z-index:10;display:flex;min-height:64px;align-items:center;gap:18px;padding:9px 18px;border-bottom:1px solid var(--line);background:rgba(27,29,34,.96);backdrop-filter:blur(14px)}
    .back{display:grid;width:40px;height:40px;place-items:center;border-radius:50%;color:var(--text);text-decoration:none;font-size:1.35rem}
    .back:hover,.back:focus-visible{background:#30333a}
    .brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.02em}
    .brand-mark{display:grid;width:31px;height:31px;place-items:center;border-radius:9px;background:linear-gradient(145deg,#6e9fff,#7d68e8);font-weight:800}
    .file-meta{min-width:0;margin-right:auto}
    .file-name{margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.88rem;font-weight:650}
    .shared-by{margin:2px 0 0;color:var(--muted);font-size:.69rem}
    .owner-link{display:flex;align-items:center;gap:9px;padding:4px 5px 4px 10px;border-radius:24px;color:var(--text);text-decoration:none}
    .owner-link:hover,.owner-link:focus-visible{background:#30333a}
    .owner-label{font-size:.72rem;color:#d8dbe1}
    .owner-avatar{display:grid;width:42px;height:42px;place-items:center;border-radius:50%;color:#fff;background:linear-gradient(145deg,#7b68ad,#4f436f);font-size:.73rem;font-weight:700;box-shadow:0 0 0 2px rgba(255,255,255,.12)}
    main{display:grid;flex:1;min-height:calc(100vh - 132px);place-items:center;padding:22px 20px 28px;background:radial-gradient(circle at 50% 32%,#292d34 0,#17191d 62%)}
    .photo-stage{display:flex;max-width:100%;flex-direction:column;align-items:center;gap:11px}
    .photo{display:block;width:auto;max-width:min(92vw,520px);height:auto;max-height:calc(100vh - 180px);border-radius:3px;background:#111;box-shadow:0 18px 55px rgba(0,0,0,.48)}
    .photo-note{margin:0;color:var(--muted);font-size:.68rem}
    .site-footer{border-top:1px solid #2d3036;background:var(--footer)}
    .footer-inner{display:flex;max-width:1180px;margin:auto;align-items:center;gap:22px;padding:14px 20px}
    .fiction-notice{margin:0 auto 0 0;color:#8d929b;font-size:.67rem;line-height:1.65}
    .archive-button{flex:none;padding:7px 12px;border:1px solid #555a63;border-radius:8px;color:#e4e6ea;background:#202329;cursor:pointer;font-weight:700;letter-spacing:.08em}
    .archive-overlay{position:fixed;inset:0;z-index:50;display:none;place-items:center;padding:18px;background:rgba(0,0,0,.68)}
    .archive-overlay.is-open{display:grid}
    .archive-dialog{width:min(600px,100%);max-height:min(760px,90vh);overflow:hidden;border:1px solid #d4d6db;border-radius:16px;color:#282a2f;background:#fff;box-shadow:0 24px 80px rgba(0,0,0,.42)}
    .archive-header{display:flex;align-items:center;padding:16px 18px;border-bottom:1px solid #e4e5e8}
    .archive-header h2{margin:0 auto 0 0;font-size:1rem}
    .archive-close{width:34px;height:34px;border:0;border-radius:50%;background:#f0f1f3;cursor:pointer;font-size:1.25rem}
    .archive-content{max-height:calc(90vh - 68px);overflow:auto;padding:18px}
    .archive-description{margin:0 0 15px;color:#696c73;font-size:.76rem;line-height:1.7}
    .archive-list{display:grid;gap:6px;margin:0;padding:0;list-style:none}
    .archive-entry{display:grid;grid-template-columns:42px 1fr;gap:10px;padding:9px 11px;border-radius:8px;color:#303238;background:#f6f7f8;text-decoration:none}
    .archive-entry:not(.is-locked):hover{background:#eaf1ff}
    .archive-entry.is-locked{color:#aaaeb5}
    .archive-number{font-variant-numeric:tabular-nums;font-weight:700}
    .archive-tools{margin-top:18px;padding-top:15px;border-top:1px solid #e3e4e7}
    .archive-reset-button{padding:8px 11px;border:1px solid #c9a5a5;border-radius:7px;color:#934e4e;background:#fff8f8;cursor:pointer}
    .reset-confirm{margin-top:10px;padding:12px;border-radius:9px;background:#fff3f3;font-size:.75rem}
    .reset-confirm p{margin:0 0 10px}
    .reset-actions{display:flex;justify-content:flex-end;gap:8px}
    .reset-actions button{padding:7px 10px;border:1px solid #bbb;border-radius:6px;background:#fff;cursor:pointer}
    .reset-actions .danger{color:#fff;background:#9d4c4c;border-color:#9d4c4c}
    @media(max-width:600px){.viewer-header{gap:8px;padding:8px 10px}.brand{display:none}.owner-label{display:none}.file-name{font-size:.76rem}.photo{max-width:94vw;max-height:calc(100vh - 175px)}.footer-inner{align-items:flex-end}.fiction-notice{font-size:.58rem}}
  </style>
  <style>
    body.archive-open{overflow:hidden}
    .archive-button{flex:0 0 auto;min-width:128px;padding:10px 13px;border:1px solid #8f8a7f;border-radius:0;color:#353431;background:#fff;font-size:.76rem;font-weight:700;letter-spacing:.08em;cursor:pointer}
    .archive-button:hover,.archive-button:focus-visible{border-color:#9b1c1c;color:#9b1c1c;background:#fffafa}
    .archive-overlay{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;padding:20px;background:rgba(22,22,22,.7);opacity:0;visibility:hidden;transition:opacity .18s ease,visibility .18s ease}
    .archive-overlay.is-open{display:grid;opacity:1;visibility:visible}
    .archive-dialog{width:min(520px,100%);max-height:min(680px,calc(100vh - 40px));overflow:hidden;border:1px solid #aaa59a;border-radius:0;color:#272623;background:#f9f7f1;box-shadow:0 22px 60px rgba(0,0,0,.34);transform:translateY(10px);transition:transform .18s ease}
    .archive-overlay.is-open .archive-dialog{transform:translateY(0)}
    .archive-header{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:19px 20px;border-bottom:1px solid #c8c3b7;color:#fff;background:#292a2c}
    .archive-header h2{margin:0;font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:1.12rem;letter-spacing:.08em}
    .archive-close{width:36px;height:36px;padding:0;border:1px solid #747577;border-radius:0;color:#fff;background:transparent;font-size:1.45rem;line-height:1;cursor:pointer}
    .archive-content{max-height:calc(100vh - 118px);overflow:auto;padding:20px}
    .archive-description{margin:0 0 15px;color:#68655f;font-size:.8rem;line-height:1.7}
    .archive-list{display:block;max-height:390px;margin:0;padding:0;overflow-y:auto;border-top:1px solid #cbc6bb;list-style:none}
    .archive-list li{margin:0}
    .archive-entry{display:grid;grid-template-columns:64px 1fr;align-items:center;gap:12px;padding:13px 11px;border:0;border-bottom:1px solid #d8d3c8;border-radius:0;color:#272623;background:#fff;text-decoration:none}
    a.archive-entry:hover,a.archive-entry:focus-visible{background:#fff4f4}
    .archive-entry.is-locked{color:#99958d;background:#efede7;cursor:default;user-select:none}
    .archive-number{color:#9b1c1c;font-family:Consolas,monospace;font-size:.78rem;font-weight:700}
    .archive-entry.is-locked .archive-number{color:#8c8880}
    .archive-title{font-size:.88rem;line-height:1.5}
    .archive-entry.is-locked .archive-title{letter-spacing:.18em}
    .archive-tools{margin-top:15px;padding-top:14px;border-top:1px solid #d2cdc2}
    .archive-reset-button{padding:9px 12px;border:1px solid #a98787;border-radius:0;color:#824c4c;background:#fff7f7;font-size:.76rem;cursor:pointer}
    .reset-confirm{margin-top:14px;padding:14px;border:1px solid #c9c3b7;border-radius:0;color:#53514c;background:#faf8f3;font-size:.8rem;line-height:1.7}
    .reset-confirm p{margin:0 0 12px}
    .reset-actions{display:flex;justify-content:flex-end;gap:8px}
    .reset-actions button{padding:8px 12px;border:1px solid #aaa59a;border-radius:0;color:#3e3d39;background:#fff;cursor:pointer}
    .reset-actions .danger{border-color:#9a5757;color:#fff;background:#9a5757}
  </style>
</head>
<body>
  <header class="viewer-header">
    <a class="back" href="mail.html" aria-label="メールへ戻る">‹</a>
    <div class="brand"><span class="brand-mark">C</span><span>Cloudfile</span></div>
    <div class="file-meta"><p class="file-name">IMG_0817_0714.png</p><p class="shared-by">雅巳さんが共有した写真</p></div>
    <a class="owner-link" href="masami-cloud.html" aria-label="雅巳のクラウドを開く"><span class="owner-label">所有者</span><span class="owner-avatar">雅巳</span></a>
  </header>
  <main>
    <div class="photo-stage">
      <!-- 場面：クラウドサービスの写真プレビュー。ターゲット層：ARGを探索するプレイヤー。テーマ・コンセプト：発見報告に見せかけた遠距離からの隠し撮り。含めたい要素：住宅街を歩くHANAの後ろ姿、生垣越しの視点、縦持ちスマートフォンの構図。カラーテーマ：夏の夕方の自然な緑とベージュ。画像サイズ：9:16の縦長。レイアウトイメージ：画面中央に画像を大きく表示し、周囲は暗い写真ビューワー。 -->
      <img class="photo" src="images/hana-found.png" alt="住宅街を歩く女性の後ろ姿">
      <p class="photo-note">共有された写真 · オリジナル画質</p>
    </div>
  </main>
  <footer class="site-footer"><div class="footer-inner"><p class="fiction-notice">このサイトの内容はフィクションです。登場する人物・団体・名称等は架空のものであり、実在のものとは関係ありません。</p><button class="archive-button" id="archiveButton" type="button">27 / 30</button></div></footer>
  <div class="archive-overlay" id="archiveOverlay" aria-hidden="true"><section class="archive-dialog" role="dialog" aria-modal="true" aria-labelledby="archiveTitle"><header class="archive-header"><h2 id="archiveTitle">ページアーカイブ</h2><button class="archive-close" id="archiveClose" type="button" aria-label="閉じる">×</button></header><div class="archive-content"><p class="archive-description">一度訪れたページが記録されます。解放済みのページを選ぶと、そのページへ戻れます。未探索のページは「？？？」と表示されます。</p><ol class="archive-list" id="archiveList"></ol><div class="archive-tools"><button class="archive-reset-button" id="archiveResetButton" type="button">アーカイブをリセット</button><div class="reset-confirm" id="resetConfirm" hidden><p>探索済みページの記録を消去しますか？ メールの会話は消去されません。</p><div class="reset-actions"><button id="resetCancel" type="button">キャンセル</button><button class="danger" id="resetAccept" type="button">リセットする</button></div></div></div></div></section></div>
  <script>
    const archiveStorageKey='hanazono-page-archive-v1',totalPages=30,currentPage={number:27,title:'共有された写真 | Cloudfile',href:'cloud-photo.html'};
    const archiveButton=document.getElementById('archiveButton'),archiveOverlay=document.getElementById('archiveOverlay'),archiveClose=document.getElementById('archiveClose'),archiveList=document.getElementById('archiveList'),archiveResetButton=document.getElementById('archiveResetButton'),resetConfirm=document.getElementById('resetConfirm'),resetCancel=document.getElementById('resetCancel'),resetAccept=document.getElementById('resetAccept');
    function loadArchive(){try{const saved=JSON.parse(localStorage.getItem(archiveStorageKey)||'[]');return Array.isArray(saved)?saved:[]}catch(error){return[]}}
    function saveArchive(pages){try{localStorage.setItem(archiveStorageKey,JSON.stringify(pages))}catch(error){}}
    function registerCurrentPage(){const pages=loadArchive(),index=pages.findIndex(page=>page.number===currentPage.number);if(index>=0)pages[index]=currentPage;else pages.push(currentPage);pages.sort((a,b)=>a.number-b.number);saveArchive(pages);return pages}
    function renderArchive(){const pages=registerCurrentPage();archiveList.textContent='';for(let number=1;number<=totalPages;number+=1){const page=pages.find(item=>item.number===number),li=document.createElement('li'),entry=document.createElement(page?'a':'div'),no=document.createElement('span'),title=document.createElement('span');entry.className='archive-entry';no.className='archive-number';title.className='archive-title';no.textContent=String(number).padStart(2,'0');if(page){entry.href=page.href;title.textContent=page.title}else{entry.classList.add('is-locked');title.textContent='？？？'}entry.append(no,title);li.appendChild(entry);archiveList.appendChild(li)}}
    function openArchive(){renderArchive();resetConfirm.hidden=true;archiveOverlay.classList.add('is-open');archiveOverlay.setAttribute('aria-hidden','false');document.body.classList.add('archive-open');archiveClose.focus()}
    function closeArchive(){archiveOverlay.classList.remove('is-open');archiveOverlay.setAttribute('aria-hidden','true');document.body.classList.remove('archive-open');archiveButton.focus()}
    registerCurrentPage();archiveButton.addEventListener('click',openArchive);archiveClose.addEventListener('click',closeArchive);archiveOverlay.addEventListener('click',event=>{if(event.target===archiveOverlay)closeArchive()});archiveResetButton.addEventListener('click',()=>{resetConfirm.hidden=false;resetCancel.focus()});resetCancel.addEventListener('click',()=>{resetConfirm.hidden=true;archiveResetButton.focus()});resetAccept.addEventListener('click',()=>{localStorage.removeItem(archiveStorageKey);window.location.href='index.html'});document.addEventListener('keydown',event=>{if(event.key==='Escape'&&archiveOverlay.classList.contains('is-open'))closeArchive()});
  </script>
<style id="archiveHintStyles">.archive-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px}.archive-row>.archive-entry{min-width:0}.archive-hint-link{display:grid;min-width:62px;place-items:center;padding:6px 9px;border:1px solid #aaa59a;color:#5f5550;background:#fffaf4;font:700 .68rem/1.4 "Yu Gothic","YuGothic",sans-serif;text-decoration:none}.archive-hint-link:hover,.archive-hint-link:focus-visible{border-color:#8d6573;color:#744c5b;background:#f8e9ee}@media(max-width:430px){.archive-row{grid-template-columns:minmax(0,1fr) 56px}.archive-hint-link{min-width:56px;padding-inline:5px}}</style>
<script id="archiveHintScript">(()=>{const list=document.getElementById('archiveList');if(!list)return;const decorate=()=>{observer.disconnect();Array.from(list.children).forEach((row,index)=>{if(row.querySelector('.archive-hint-link'))return;row.classList.add('archive-row');const link=document.createElement('a');link.className='archive-hint-link';link.href='hint.html#page-'+(index+1);link.target='_blank';link.rel='noopener noreferrer';link.textContent='ヒント';link.setAttribute('aria-label','ページ '+(index+1)+' のヒントを見る');row.appendChild(link)});observer.observe(list,{childList:true})};const observer=new MutationObserver(decorate);observer.observe(list,{childList:true});decorate()})();</script></body>
</html>
