<footer class="site-footer"><div class="footer-inner"><p class="fiction-notice">このサイトの内容はフィクションです。登場する人物・団体・名称等は架空のものであり、実在のものとは関係ありません。</p><button class="archive-button" id="archiveButton" type="button" aria-haspopup="dialog" aria-controls="archiveOverlay">23 / 30</button></div></footer><div class="archive-overlay" id="archiveOverlay" aria-hidden="true"><section class="archive-dialog" role="dialog" aria-modal="true" aria-labelledby="archiveTitle"><header class="archive-header"><h2 id="archiveTitle">ページアーカイブ</h2><button class="archive-close" id="archiveClose" type="button" aria-label="ページアーカイブを閉じる">×</button></header><div class="archive-content"><p class="archive-description">一度訪れたページが記録されます。解放済みのページを選ぶと、そのページへ戻れます。未探索のページは「？？？」と表示されます。</p><ol class="archive-list" id="archiveList"></ol><div class="archive-tools"><button class="archive-reset-button" id="archiveResetButton" type="button">アーカイブをリセット</button><div class="archive-reset-confirm" id="archiveResetConfirm" role="alertdialog" aria-labelledby="archiveResetTitle" hidden><p id="archiveResetTitle">探索済みページの記録を消去しますか？ メールの会話は消去されません。</p><div class="confirm-actions"><button id="archiveResetCancel" type="button">キャンセル</button><button class="danger" id="archiveResetConfirmButton" type="button">リセットする</button></div></div></div></div></section></div><script>const archiveButton=document.getElementById('archiveButton'),archiveOverlay=document.getElementById('archiveOverlay'),archiveClose=document.getElementById('archiveClose'),archiveList=document.getElementById('archiveList'),archiveResetButton=document.getElementById('archiveResetButton'),archiveResetConfirm=document.getElementById('archiveResetConfirm'),archiveResetCancel=document.getElementById('archiveResetCancel'),archiveResetConfirmButton=document.getElementById('archiveResetConfirmButton'),archiveStorageKey='hanazono-page-archive-v1',totalPages=30,currentPage={number:23,title:'交換日記・入口',href:'hana-private-login.html'};function loadArchive(){try{const saved=JSON.parse(localStorage.getItem(archiveStorageKey)||'[]');return Array.isArray(saved)?saved:[]}catch(error){return[]}}function saveArchive(pages){try{localStorage.setItem(archiveStorageKey,JSON.stringify(pages))}catch(error){}}function migrateShiftedArchive(){const shiftedNumbers={'hana-private-login.html':23,'hana-private.html':24,'hana-private-move.html':25,'hana-private-safety.html':26},loaded=loadArchive(),pages=loaded.filter(function(page){return page.href!=='hana-blog-hidden-trip.html'});let changed=pages.length!==loaded.length;pages.forEach(function(page){const shifted=shiftedNumbers[page.href];if(shifted&&page.number!==shifted){page.number=shifted;changed=true}});if(changed){pages.sort(function(a,b){return a.number-b.number});saveArchive(pages)}}function registerCurrentPage(){const pages=loadArchive(),index=pages.findIndex(function(page){return page.number===currentPage.number});if(index>=0)pages[index]=currentPage;else pages.push(currentPage);pages.sort(function(a,b){return a.number-b.number});saveArchive(pages);return pages}function renderArchive(){const pages=registerCurrentPage();archiveList.textContent='';for(let number=1;number<=totalPages;number+=1){const page=pages.find(function(item){return item.number===number}),li=document.createElement('li'),entry=document.createElement(page?'a':'div'),no=document.createElement('span'),title=document.createElement('span');entry.className='archive-entry';no.className='archive-number';title.className='archive-title';no.textContent=String(number).padStart(2,'0');if(page){entry.href=page.href;title.textContent=page.title}else{entry.classList.add('is-locked');title.textContent='？？？'}entry.append(no,title);li.appendChild(entry);archiveList.appendChild(li)}}function openArchive(){renderArchive();archiveResetConfirm.hidden=true;archiveOverlay.classList.add('is-open');archiveOverlay.setAttribute('aria-hidden','false');document.body.classList.add('archive-open');archiveClose.focus()}function closeArchive(){archiveResetConfirm.hidden=true;archiveOverlay.classList.remove('is-open');archiveOverlay.setAttribute('aria-hidden','true');document.body.classList.remove('archive-open');archiveButton.focus()}migrateShiftedArchive();registerCurrentPage();archiveButton.addEventListener('click',openArchive);archiveClose.addEventListener('click',closeArchive);archiveOverlay.addEventListener('click',function(event){if(event.target===archiveOverlay)closeArchive()});archiveResetButton.addEventListener('click',function(){archiveResetConfirm.hidden=false;archiveResetCancel.focus()});archiveResetCancel.addEventListener('click',function(){archiveResetConfirm.hidden=true;archiveResetButton.focus()});archiveResetConfirmButton.addEventListener('click',function(){try{localStorage.removeItem(archiveStorageKey);localStorage.removeItem('hanazono-hidden-blog-lead-v1');localStorage.removeItem('hanazono-about-mail-notification-v1');localStorage.removeItem('hanazono-hidden-url-revealed-v1');localStorage.removeItem('hanazono-private-blog-unlocked-v1')}catch(error){}window.location.href='index.html'});document.addEventListener('keydown',function(event){if(event.key==='Escape'&&archiveOverlay.classList.contains('is-open')){if(!archiveResetConfirm.hidden){archiveResetConfirm.hidden=true;archiveResetButton.focus()}else closeArchive()}});function normalize(value){return value.normalize('NFKC').replace(/[\s　。、！!？?「」『』・]/g,'').replace(/一人/g,'ひとり').replace(/からね$/,'')}document.getElementById('loginForm').addEventListener('submit',function(event){event.preventDefault();const passwordInput=document.getElementById('password'),errorMessage=document.getElementById('error');if(normalize(passwordInput.value)==='青い傘'){localStorage.setItem('hanazono-private-blog-unlocked-v1','1');window.location.href='hana-private.html'}else{errorMessage.textContent=normalize(passwordInput.value)==='雨宿り'?'「雨宿り」は、待ち合わせを頼むための合図です。待っていることを知らせていた「目印」を思い出してください。':'目印が違います。';passwordInput.select()}});</script><style id="archiveHintStyles">.archive-row{display:grid;gr <script id="archiveHintScript">(()=>{const list=document.getElementById('archiveList');if(!list)return;const decorate=()=>{observer.disconnect();Array.from(list.children).forEach((row,index)=>{if(row.querySelector('.archive-hint-link'))return;row.classList.add('archive-row');const link=document.createElement('a');link.className='archive-hint-link';link.href='hint.html#page-'+(index+1);link.target='_blank';link.rel='noopener noreferrer';link.textContent='ヒント';link.setAttribute('aria-label','ページ '+(index+1)+' のヒントを見る');row.appendChild(link)});observer.observe(list,{childList:true})};const observer=new MutationObserver(decorate);observer.observe(list,{childList:true});decorate()})();</script></body></html>
