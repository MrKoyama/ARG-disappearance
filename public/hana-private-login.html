<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>限定記録・認証</title><style>
*{box-sizing:border-box}body{min-width:320px;min-height:100vh;margin:0;color:#4d5058;background:#e7e7e9;font-family:"Yu Gothic",sans-serif}.head{padding:44px 20px;border-bottom:1px solid #b8bac2;background:linear-gradient(135deg,#eef0f2,#dedfe2);text-align:center}.head h1{margin:0;font-family:"Yu Mincho",serif;font-weight:400;letter-spacing:.16em}.head p{margin:8px 0 0;color:#7b7d87;font-size:.78rem}.wrap{width:min(600px,calc(100% - 28px));margin:48px auto}.card{padding:32px;border:1px solid #c1c2c9;background:#fbfaf7;box-shadow:0 8px 28px #35374422}.lock{font-size:2rem;text-align:center}.card h2{text-align:center;font:400 1.25rem "Yu Mincho",serif}.card>p{font-size:.82rem;line-height:1.8}.field{display:flex;gap:8px;margin-top:22px}.field input{min-width:0;flex:1;padding:12px;border:1px solid #adaeb7;background:#fff;font:inherit}.field button{padding:10px 18px;border:1px solid #555668;color:#fff;background:#707184;cursor:pointer}.error{min-height:1.5em;margin:9px 0 0;color:#9a4f4f;font-size:.76rem}.back{display:block;margin-top:18px;text-align:center;font-size:.78rem}.foot{margin-top:60px;border-top:1px solid #c1c2c6;background:#e8e8e6}.footin{width:min(980px,calc(100% - 32px));margin:auto;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:16px 0}.foot p{font-size:.72rem}.archive{padding:10px 15px;border:1px solid #85858d;background:#fff;font-weight:700;cursor:pointer}.overlay{position:fixed;inset:0;display:none;place-items:center;padding:20px;background:#161619bb}.overlay.open{display:grid}.dialog{width:min(520px,100%);max-height:85vh;overflow:auto;padding:18px;background:#f9f7f1}.dialog header{display:flex;justify-content:space-between}.dialog h2{margin:0;font-size:1rem}.close{width:34px;height:34px}.list{padding:0;display:grid;gap:5px;list-style:none}.entry{display:grid;grid-template-columns:45px 1fr;border:1px solid #bbb6ab;background:#fff;color:#343330;text-decoration:none}.entry.locked{color:#999;background:#e6e3dc}.entry span{padding:9px}.entry span:first-child{border-right:1px solid #ccc7bc;text-align:center}.reset{margin-top:12px;padding:8px;border:1px solid #a98787;color:#824c4c;background:#fff7f7}.confirm{margin-top:10px;padding:12px;border:1px solid #c8a4a4;background:#fff8f7}.confirm[hidden]{display:none}.confirm button{margin-right:6px;padding:7px}.danger{color:#fff;background:#995c5c}@media(max-width:600px){.wrap{margin:25px auto}.card{padding:24px 18px}.field{flex-direction:column}.footin{align-items:stretch;flex-direction:column}.archive{width:100%}}</style></head><body>
<header class="head"><h1>限定記録</h1><p>KANA / HANA ONLY</p></header><main class="wrap"><section class="card"><div class="lock">🔒</div><h2>合言葉を入力してください</h2><p>この先は、共有された相手だけが読める記録です。</p><form id="loginForm" class="field"><label for="password" hidden>合言葉</label><input id="password" autocomplete="off" autofocus><button>開く</button></form><p class="error" id="error" role="alert"></p><a class="back" href="hana-blog-hidden-leave.html">ひとりごとへ戻る</a></section></main>
<footer class="foot"><div class="footin"><p>このサイトの内容はフィクションです。登場する人物・団体・名称等は架空のものであり、実在のものとは関係ありません。</p><button class="archive" id="archiveButton">21 / 30</button></div></footer><div class="overlay" id="overlay"><section class="dialog" role="dialog" aria-modal="true"><header><h2>ページアーカイブ</h2><button class="close" id="archiveClose">×</button></header><p>一度訪れたページが記録されます。未探索のページは「？？？」と表示されます。</p><ol class="list" id="list"></ol><button class="reset" id="reset">アーカイブをリセット</button><div class="confirm" id="confirm" hidden><p>探索済みページの記録を消去しますか？</p><button id="cancel">キャンセル</button><button class="danger" id="doReset">リセットする</button></div></section></div>
<script>const archiveKey='hanazono-page-archive-v1',unlockKey='hanazono-private-blog-unlocked-v1',current={number:21,title:'限定記録・認証',href:'hana-private-login.html'},total=30;function load(){try{return JSON.parse(localStorage.getItem(archiveKey)||'[]')}catch(e){return[]}}function register(){const a=load().filter(x=>x.number!==current.number);a.push(current);a.sort((x,y)=>x.number-y);localStorage.setItem(archiveKey,JSON.stringify(a));return a}register();function normalize(v){return v.normalize('NFKC').replace(/[\s　。、！!？?「」『』・]/g,'').replace(/一人/g,'ひとり').replace(/からね$/,'')}document.getElementById('loginForm').addEventListener('submit',e=>{e.preventDefault();if(normalize(password.value)==='ひとりじゃない'){localStorage.setItem(unlockKey,'1');location.href='hana-private.html'}else{error.textContent='合言葉が違います。';password.select()}});const overlay=document.getElementById('overlay'),list=document.getElementById('list'),confirm=document.getElementById('confirm');function render(){const pages=register();list.innerHTML='';for(let n=1;n<=total;n++){const p=pages.find(x=>x.number===n),li=document.createElement('li'),el=document.createElement(p?'a':'div');el.className='entry'+(p?'':' locked');if(p)el.href=p.href;el.innerHTML='<span>'+String(n).padStart(2,'0')+'</span><span>'+(p?p.title:'？？？')+'</span>';li.append(el);list.append(li)}}archiveButton.onclick=()=>{render();overlay.classList.add('open')};archiveClose.onclick=()=>overlay.classList.remove('open');reset.onclick=()=>confirm.hidden=false;cancel.onclick=()=>confirm.hidden=true;doReset.onclick=()=>{localStorage.removeItem(archiveKey);localStorage.removeItem(unlockKey);location.href='index.html'};</script></body></html>
